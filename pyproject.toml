[project]
name = "soilgrain"
version = "1.0.0"
description = "AI401 Assignment #1: soil grain-size distribution from calibrated photos with CNNs, ViTs and SSL encoders"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pillow>=10.4",
    "matplotlib>=3.8",
    "scikit-learn>=1.5",
    "torch>=2.5",
    "torchvision>=0.20",
    "timm==1.0.29",
    "lightning>=2.4",
    "albumentations>=1.4",
    "tqdm>=4.66",
    "pyyaml>=6.0",
    "tabulate>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/soilgrain"]
